<text x="34" y="332" xml:space="preserve" class="t">      indie-keeper</text>
<text x="34" y="356" xml:space="preserve" class="t"></text>
<text x="34" y="380" xml:space="preserve" class="t">  用法：keeper &lt;命令&gt; [参数…]</text>
<text x="34" y="404" xml:space="preserve" class="t"></text>
<text x="34" y="428" xml:space="preserve" class="t">  ── 日常 ──</text>
<text x="34" y="452" xml:space="preserve" class="t">  hello     30 秒接班速查（进门先跑这个）</text>
<text x="34" y="476" xml:space="preserve" class="t">  status    工作区健康度一眼看</text>
<text x="34" y="500" xml:space="preserve" class="t">  where     主题 → 权威文档 · 例：keeper where 角色</text>
<text x="34" y="524" xml:space="preserve" class="t"></text>
<text x="34" y="548" xml:space="preserve" class="t">  ── 房间 ──</text>
<text x="34" y="572" xml:space="preserve" class="t">  房间       别名          管什么</text>
<text x="34" y="596" xml:space="preserve" class="t">  truth     archive      档案室 · 真相源登记 · 章节安全编辑 · 体检</text>
<text x="34" y="620" xml:space="preserve" class="t">  fb        feedback     意见箱 · 反馈收集 · 生命周期 · 挂 ROADMAP</text>
<text x="34" y="644" xml:space="preserve" class="t">  site      —            WIKI · 本地浏览（双链/反链）· 单文件打包</text>
<text x="34" y="668" xml:space="preserve" class="t">  docs      docs-i18n    文档翻译部 · 文档多语言：拆壳 · 盖章 · 看表</text>
<text x="34" y="692" xml:space="preserve" class="t">  game      game-i18n    游戏文案部 · 游戏内文案：硬编码扫描 · 漂移 · 术语表</text>
<text x="34" y="716" xml:space="preserve" class="t">  ver       version      发货口·版本 · 版本号多文件同步</text>
<text x="34" y="740" xml:space="preserve" class="t">  sprint    —            发货口·验收 · Sprint 验收清单 · lint 防糊弄</text>
